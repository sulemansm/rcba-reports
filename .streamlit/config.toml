[theme]
primaryColor      = "#00C9B1"
backgroundColor   = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor         = "#FAFAFA"
font              = "sans serif"

[server]
headless          = true
enableCORS        = false
enableXsrfProtection = true

[logger]
level             = "info"

[client]
showErrorDetails  = false
